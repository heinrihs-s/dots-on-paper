# MERGE FRAGMENT for automations.yaml; edit your config entry/device IDs.
# Requires OpenEPaperLink HA integration and a reachable bridge.
# Use a secrets.yaml entry `dots_oep_image_url` containing:
# "http://YOUR_BRIDGE_HOST:9035/image.png?profile=oep_296&key=YOUR_SCOPED_DOTS_IMAGE_TOKEN"
# The image key is read-only; never put the write API key or HA token in this URL.
# Select oep_400 or explicit width/height for a different tag. Target size below
# must match that profile. This displays the final answer, not a rapid loop.
# Official: https://github.com/OpenEPaperLink/Home_Assistant_Integration

- alias: Dot answer to OpenEPaperLink
  mode: queued
  max: 3
  triggers:
    - trigger: event
      event_type: dot_reply
      event_data:
        entry_id: REPLACE_WITH_DOTS_CONFIG_ENTRY_ID
  actions:
    - action: open_epaper_link.drawcustom
      target:
        device_id: REPLACE_WITH_OPENEPAPERLINK_DEVICE_ID
      data:
        background: white
        rotate: 0
        dither: 0
        # Tag checks in after this interval. Long TTLs delay later updates.
        ttl: 60
        dry-run: false
        payload:
          - type: dlimg
            url: !secret dots_oep_image_url
            x: 0
            y: 0
            xsize: 296
            ysize: 128
